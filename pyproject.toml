[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network_and_cloud_automation"
version = "0.1.3"
description = "AWS Benchmark Toolkit"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "pytest>=9.0.0",

]

[tool.setuptools.packages.find]
where = ["cloud_security_automation"]  # This tells Python to look for folders with __init__.py in the root
